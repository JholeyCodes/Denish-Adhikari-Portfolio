<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#0B0F14"/>
  <!-- Steel Formwork Panels -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="180" height="240" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <rect x="220" y="0" width="180" height="240" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <!-- Concrete Gap (Wall Core) -->
    <rect x="180" y="0" width="40" height="240" fill="#475569" fill-opacity="0.8"/>
    <!-- Tie Rods & Wing Nuts -->
    <line x1="-20" y1="60" x2="420" y2="60" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="-10" cy="60" r="8" fill="#38BDF8"/>
    <circle cx="410" cy="60" r="8" fill="#38BDF8"/>

    <line x1="-20" y1="160" x2="420" y2="160" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="-10" cy="160" r="8" fill="#38BDF8"/>
    <circle cx="410" cy="160" r="8" fill="#38BDF8"/>

    <!-- Diagonal Braces -->
    <line x1="0" y1="100" x2="-60" y2="240" stroke="#F97316" stroke-width="4"/>
    <line x1="400" y1="100" x2="460" y2="240" stroke="#F97316" stroke-width="4"/>
  </g>

  <rect x="40" y="380" width="520" height="45" rx="6" fill="#111827" stroke="#273244"/>
  <text x="60" y="408" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">STEEL SHUTTERING &amp; FORM TIE TENSIONING INSPECTION</text>
</svg>
