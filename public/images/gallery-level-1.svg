<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#0F172A"/>
  <!-- Auto Level Line of Sight -->
  <line x1="120" y1="200" x2="480" y2="200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Staff with Level Reading -->
  <rect x="470" y="80" width="20" height="260" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="470" y="90" width="10" height="20" fill="#EF4444"/>
  <rect x="480" y="110" width="10" height="20" fill="#EF4444"/>
  <rect x="470" y="130" width="10" height="20" fill="#EF4444"/>
  <rect x="480" y="150" width="10" height="20" fill="#EF4444"/>
  <rect x="470" y="170" width="10" height="20" fill="#EF4444"/>
  <rect x="480" y="190" width="10" height="20" fill="#EF4444"/>
  <text x="500" y="205" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">BS = 1.485m</text>

  <!-- Auto Level Body -->
  <rect x="80" y="180" width="70" height="40" rx="3" fill="#F97316"/>
  <rect x="150" y="190" width="20" height="20" rx="2" fill="#0B0F14"/>
  <line x1="115" y1="220" x2="80" y2="340" stroke="#94A3B8" stroke-width="4"/>
  <line x1="115" y1="220" x2="150" y2="340" stroke="#94A3B8" stroke-width="4"/>

  <rect x="40" y="380" width="520" height="45" rx="6" fill="#111827" stroke="#273244"/>
  <text x="60" y="408" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">AUTO LEVEL DIFFERENTIAL LEVELING // PIPELINE INVERT GRADIENT</text>
</svg>
