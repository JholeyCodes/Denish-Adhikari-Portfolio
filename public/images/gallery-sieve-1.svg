<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#0F172A"/>
  <!-- Stack of Sieve Nest -->
  <g transform="translate(180, 70)">
    <rect x="0" y="0" width="240" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>
    <text x="70" y="20" fill="#F8FAFC" font-family="monospace" font-size="11">20mm SIEVE</text>

    <rect x="0" y="35" width="240" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>
    <text x="70" y="55" fill="#F8FAFC" font-family="monospace" font-size="11">10mm SIEVE</text>

    <rect x="0" y="70" width="240" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>
    <text x="70" y="90" fill="#F8FAFC" font-family="monospace" font-size="11">4.75mm (IS)</text>

    <rect x="0" y="105" width="240" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>
    <text x="70" y="125" fill="#F8FAFC" font-family="monospace" font-size="11">2.36mm SIEVE</text>

    <rect x="0" y="140" width="240" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>
