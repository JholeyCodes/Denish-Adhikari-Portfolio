<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="structBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#structBg)"/>

  <text x="40" y="50" fill="#F97316" font-family="monospace" font-weight="bold" font-size="14" letter-spacing="2">PROJECT 04 // ENGINEERING CAPSTONE</text>
  <text x="40" y="80" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="24">Multi-Storey RCC Seismic Structural Analysis</text>
  <text x="40" y="105" fill="#A7B0BD" font-family="sans-serif" font-size="13">Lumbini Engineering College (Pokhara University) • NBC 105:2020 &amp; IS 1893:2016</text>

  <!-- 3D Space Frame Wireframe Model -->
  <g transform="translate(240, 140)">
    <!-- Base Level 0 Footings -->
    <rect x="0" y="240" width="30" height="20" fill="#F97316"/>
    <rect x="140" y="240" width="30" height="20" fill="#F97316"/>
    <rect x="280" y="240" width="30" height="20" fill="#F97316"/>

    <!-- Columns -->
    <line x1="15" y1="240" x2="15" y2="40" stroke="#38BDF8" stroke-width="4"/>
    <line x1="155" y1="240" x2="155" y2="40" stroke="#38BDF8" stroke-width="4"/>
    <line x1="295" y1="240" x2="295" y2="40" stroke="#38BDF8" stroke-width="4"/>

    <!-- Floor Beams -->
    <!-- Level 1 Plinth -->
    <line x1="15" y1="200" x2="295" y2="200" stroke="#F97316" stroke-width="3"/>
    <!-- Level 2 Floor -->
    <line x1="15" y1="120" x2="295" y2="120" stroke="#F97316" stroke-width="3"/>
    <!-- Level 3 Roof -->
    <line x1="15" y1="40" x2="295" y2="40" stroke="#F97316" stroke-width="3"/>

    <!-- Isometric Back Frame (Depth) -->
    <line x1="15" y1="40" x2="75" y2="0" stroke="#64748B" stroke-width="2"/>
    <line x1="155" y1="40" x2="215" y2="0" stroke="#64748B" stroke-width="2"/>
    <line x1="295" y1="40" x2="355" y2="0" stroke="#64748B" stroke-width="2"/>
    <line x1="75" y1="0" x2="355" y2="0" stroke="#64748B" stroke-width="2"/>

    <line x1="15" y1="120" x2="75" y2="80" stroke="#64748B" stroke-width="2"/>
    <line x1="155" y1="120" x2="215" y2="80" stroke="#64748B" stroke-width="2"/>
    <line x1="295" y1="120" x2="355" y2="80" stroke="#64748B" stroke-width="2"/>
    <line x1="75" y1="80" x2="355" y2="80" stroke="#64748B" stroke-width="2"/>

    <!-- Lateral Seismic Force Vector -->
    <line x1="-80" y1="40" x2="5" y2="40" stroke="#EF4444" stroke-width="3"/>
    <polygon points="5,35 15,40 5,45" fill="#EF4444"/>
    <text x="-90" y="30" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">EQ LATERAL FORCE (F3)</text>

    <line x1="-60" y1="120" x2="5" y2="120" stroke="#EF4444" stroke-width="3"/>
    <polygon points="5,115 15,120 5,125" fill="#EF4444"/>
    <text x="-70" y="110" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">F2</text>
  </g>

  <!-- Technical Analysis Readout -->
  <g transform="translate(40, 390)">
    <rect width="360" height="70" rx="6" fill="#111827" stroke="#273244" stroke-width="1.5"/>
    <text x="15" y="25" fill="#F97316" font-family="monospace" font-size="11" font-weight="bold">RESPONSE SPECTRUM MODAL ANALYSIS</text>
    <text x="15" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="11">Time Period: T1 = 0.54s • Mass Participation: 93.4%</text>
    <text x="15" y="60" fill="#22C55E" font-family="monospace" font-size="10">Max Inter-Storey Drift = 0.0028 &lt; 0.0040 (PASSED)</text>
  </g>
</svg>
