<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="surveyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#surveyBg)"/>

  <!-- Topographic Contour Lines -->
  <path d="M 0 350 Q 200 300, 400 360 T 800 320" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M 0 390 Q 250 340, 500 400 T 800 370" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 0 430 Q 300 380, 600 440 T 800 420" fill="none" stroke="#F97316" stroke-width="2" stroke-opacity="0.8"/>

  <text x="40" y="50" fill="#F97316" font-family="monospace" font-weight="bold" font-size="14" letter-spacing="2">PROJECT 03 // GEODETIC FIELD OPERATIONS</text>
  <text x="40" y="80" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="24">Precision Surveying &amp; Total Station Staking</text>
  <text x="40" y="105" fill="#A7B0BD" font-family="sans-serif" font-size="13">High-accuracy horizontal/vertical network establishment &amp; benchmark transfer</text>

  <!-- Total Station Iconography & Ray Tracing -->
  <g transform="translate(140, 160)">
    <!-- Tripod Legs -->
    <line x1="120" y1="140" x2="60" y2="280" stroke="#F97316" stroke-width="4"/>
    <line x1="120" y1="140" x2="120" y2="285" stroke="#F97316" stroke-width="4"/>
    <line x1="120" y1="140" x2="180" y2="280" stroke="#F97316" stroke-width="4"/>
    <!-- Instrument Body -->
    <rect x="100" y="90" width="40" height="50" rx="4" fill="#E2E8F0"/>
    <circle cx="120" cy="115" r="14" fill="#0B0F14" stroke="#F97316" stroke-width="2"/>
    <!-- Telescope -->
    <rect x="90" y="110" width="60" height="10" rx="3" fill="#334155"/>
    <!-- Laser Line to Target Prism -->
    <line x1="150" y1="115" x2="480" y2="170" stroke="#EF4444" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="260" y="130" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">SLOPE DIST: 142.845m</text>
  </g>

  <!-- Target Prism on Staff -->
  <g transform="translate(600, 260)">
    <!-- Staff Pole -->
    <line x1="20" y1="70" x2="20" y2="200" stroke="#E2E8F0" stroke-width="5"/>
    <!-- Prism Assembly -->
    <polygon points="5,70 35,70 20,40" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="20" cy="55" r="8" fill="#FACC15"/>
    <text x="-40" y="30" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold">PRISM TARGET // BM-04</text>
    <text x="-40" y="45" fill="#94A3B8" font-family="monospace" font-size="10">RL: +1348.625m</text>
  </g>

  <!-- Precision Readout Box -->
  <g transform="translate(40, 390)">
    <rect width="320" height="70" rx="6" fill="#111827" stroke="#273244" stroke-width="1.5"/>
    <text x="15" y="25" fill="#F97316" font-family="monospace" font-size="11" font-weight="bold">INSTRUMENT TOLERANCE: ±2&quot; ANGLE / ±2mm DIST</text>
    <text x="15" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="11">Operation: Closed Loop Traverse &amp; Benchmark Tie-in</text>
    <text x="15" y="60" fill="#22C55E" font-family="monospace" font-size="10">Bowditch Closing Error Check: PASSED</text>
  </g>
</svg>
